        - uid: 7cf69899-8495-561e-a28e-eaee0311de2b
          title: Agent p95 latency high
          condition: threshold
          data:
            - refId: query
              queryType: prometheus
              relativeTimeRange:
                from: 660
                to: 60
              datasourceUid: grafanacloud-prom
              model:
                datasource:
                    type: prometheus
                    uid: grafanacloud-prom
                expr: histogram_quantile(0.95, sum by (le) (rate(evcare_agent_turn_duration_seconds_bucket[10m]))) > 15
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: query
            - refId: prometheus_math
              queryType: math
              datasourceUid: __expr__
              model:
                datasource:
                    IsPrunable: false
                    access: ""
                    apiVersion: ""
                    basicAuth: false
                    basicAuthUser: ""
                    created: "0001-01-01T00:00:00Z"
                    database: ""
                    id: -100
                    isDefault: false
                    jsonData: {}
                    name: __expr__
                    readOnly: false
                    secureJsonData: {}
                    type: __expr__
                    uid: __expr__
                    updated: "0001-01-01T00:00:00Z"
                    url: ""
                    user: ""
                    withCredentials: false
                expression: is_number($query) || is_nan($query) || is_inf($query)
                intervalMs: 1000
                maxDataPoints: 43200
                refId: prometheus_math
                type: math
            - refId: threshold
              queryType: threshold
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                datasource:
                    IsPrunable: false
                    access: ""
                    apiVersion: ""
                    basicAuth: false
                    basicAuthUser: ""
                    created: "0001-01-01T00:00:00Z"
                    database: ""
